name: Build MKDDDS ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Verificar grit disponível
        run: which grit

      - name: Diagnóstico ds_rules
        run: cat $DEVKITARM/ds_rules

      - name: Build do .nds (verboso, para diagnóstico)
        run: make V=1 --debug=basic

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: rom-nds
          path: mkddds.nds
