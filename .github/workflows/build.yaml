name: Build MKDDDS ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Build do .nds
        run: make

      - name: Diagnóstico dos valores reais do bitmap
        run: |
          echo "--- primeiras linhas com dados do array ---"
          grep -n "0x" build/Title_t_screen.c | head -5
          echo "--- últimas linhas com dados do array ---"
          grep -n "0x" build/Title_t_screen.c | tail -5
          echo "--- contagem de valores 0xffffffff (branco puro, se houver) ---"
          grep -o "0xFFFFFFFF\|0xffffffff" build/Title_t_screen.c | wc -l
          echo "--- contagem total de valores no array ---"
          grep -o "0x[0-9a-fA-F]\{8\}" build/Title_t_screen.c | wc -l

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: rom-nds
          path: mkddds.nds
