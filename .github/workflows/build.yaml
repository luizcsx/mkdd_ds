name: Build MKDDDS ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Verificar grit disponível
        run: which grit

      - name: Diagnóstico do ds_rules (temporário)
        run: |
          echo "--- $DEVKITARM/ds_rules ---"
          cat $DEVKITARM/ds_rules
          echo "--- ls \$DEVKITPRO ---"
          ls $DEVKITPRO
          echo "--- ls \$DEVKITPRO/calico (se existir) ---"
          ls $DEVKITPRO/calico 2>&1 || true

      - name: Build do .nds
        run: make

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: rom-nds
          path: mkddds.nds
